<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sombra profunda de interfaz pro -->
    <filter id="shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Gradiente de papel manila técnico -->
    <linearGradient id="manilaPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8B26E" />
      <stop offset="50%" stop-color="#C79F58" />
      <stop offset="100%" stop-color="#B28A43" />
    </linearGradient>

    <!-- Gradiente para la solapa plegada -->
    <linearGradient id="manilaFlap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2BD7A" />
      <stop offset="100%" stop-color="#BA924C" />
    </linearGradient>

    <!-- Bisel suave interior para efecto papel pesado -->
    <linearGradient id="innerShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12" />
    </linearGradient>
  </defs>

  <!-- Fondo base DaVinci Resolve Dark -->
  <rect width="512" height="512" rx="108" fill="#151619" />
  <!-- Borde perimetral tenue de ventana / app container -->
  <rect width="512" height="512" rx="108" fill="none" stroke="#26282D" stroke-width="2" />

  <!-- CONTENEDOR SOBRE MANILA (Proporción Oficio: 236 x 368 aprox) -->
  <g filter="url(#shadow)" transform="translate(138, 72)">
    <!-- Cuerpo del Sobre -->
    <rect x="0" y="0" width="236" height="368" rx="6" fill="url(#manilaPaper)" />
    <rect x="0" y="0" width="236" height="368" rx="6" fill="url(#innerShade)" />
    <!-- Borde de corte de guillotina -->
    <rect x="0" y="0" width="236" height="368" rx="6" fill="none" stroke="#876326" stroke-width="1.2" stroke-opacity="0.5" />

    <!-- Solapa Superior Oficio Plegada -->
    <path d="M 0,0 L 236,0 L 236,28 L 138,44 L 98,44 L 0,28 Z" fill="url(#manilaFlap)" />
    <path d="M 0,28 L 98,44 L 138,44 L 236,28" fill="none" stroke="#876326" stroke-width="1" stroke-opacity="0.45" />
    <!-- Sombra proyectada por la solapa sobre el cuerpo -->
    <path d="M 0,28 L 98,44 L 138,44 L 236,28 L 236,33 L 138,49 L 98,49 L 0,33 Z" fill="#000000" opacity="0.12" />

    <!-- ENCABEZADO DE LA GRILLA (Impresión tipográfica técnica) -->
    <!-- Caja Número de OT / Despacho -->
    <rect x="18" y="58" width="134" height="24" rx="2" fill="none" stroke="#5C421A" stroke-width="1.2" stroke-opacity="0.75" />
    <rect x="22" y="63" width="38" height="14" rx="1" fill="#5C421A" fill-opacity="0.18" />
    <!-- Micro-bloques simulando texto "ORDEN DE TRABAJO" -->
    <line x1="66" y1="70" x2="144" y2="70" stroke="#5C421A" stroke-width="2" stroke-opacity="0.75" stroke-linecap="round" />
    
    <!-- Cajetín FECHA / REF -->
    <rect x="158" y="58" width="60" height="24" rx="2" fill="none" stroke="#5C421A" stroke-width="1.2" stroke-opacity="0.75" />
    <line x1="165" y1="70" x2="211" y2="70" stroke="#5C421A" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round" />

    <!-- ================= GRILLA HOJA DE RUTA ================= -->
    <!-- Marco perimetral de la tabla -->
    <rect x="18" y="94" width="200" height="248" fill="none" stroke="#5C421A" stroke-width="1.4" stroke-opacity="0.8" />

    <!-- Encabezado de Columnas (Altura: 20px) -->
    <rect x="18" y="94" width="200" height="20" fill="#5C421A" fill-opacity="0.12" />
    <line x1="18" y1="114" x2="218" y2="114" stroke="#5C421A" stroke-width="1.2" stroke-opacity="0.8" />

    <!-- Divisiones Verticales de Columnas:
         DE (34px) | PARA (34px) | TAREA (82px) | FIRMA (50px) -->
    <line x1="52" y1="94" x2="52" y2="342" stroke="#5C421A" stroke-width="1.2" stroke-opacity="0.7" />
    <line x1="86" y1="94" x2="86" y2="342" stroke="#5C421A" stroke-width="1.2" stroke-opacity="0.7" />
    <line x1="168" y1="94" x2="168" y2="342" stroke="#5C421A" stroke-width="1.2" stroke-opacity="0.7" />

    <!-- Indicadores impresos de cabecera de columna (micro-tipografía) -->
    <!-- Columna 1: DE -->
    <line x1="26" y1="104" x2="44" y2="104" stroke="#4A3414" stroke-width="2.5" stroke-linecap="round" />
    <!-- Columna 2: PARA -->
    <line x1="60" y1="104" x2="78" y2="104" stroke="#4A3414" stroke-width="2.5" stroke-linecap="round" />
    <!-- Columna 3: TAREA -->
    <line x1="96" y1="104" x2="136" y2="104" stroke="#4A3414" stroke-width="2.5" stroke-linecap="round" />
    <!-- Columna 4: FIRMA -->
    <line x1="178" y1="104" x2="208" y2="104" stroke="#4A3414" stroke-width="2.5" stroke-linecap="round" />

    <!-- FILAS SECUENCIALES (Pases de Tráfico) -->
    <!-- Fila 1 (y: 140) -->
    <line x1="18" y1="140" x2="218" y2="140" stroke="#5C421A" stroke-width="0.9" stroke-opacity="0.5" />
    <line x1="26" y1="127" x2="44" y2="127" stroke="#4A3414" stroke-width="1.6" stroke-opacity="0.6" />
    <line x1="60" y1="127" x2="78" y2="127" stroke="#4A3414" stroke-width="1.6" stroke-opacity="0.6" />
    <line x1="94" y1="127" x2="154" y2="127" stroke="#4A3414" stroke-width="1.6" stroke-opacity="0.6" />
    <!-- Marca de pase / visto bueno en firma -->
    <path d="M 183,128 L 189,132 L 201,122" fill="none" stroke="#3D290E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />

    <!-- Fila 2 (y: 166) -->
    <line x1="18" y1="166" x2="218" y2="166" stroke="#5C421A" stroke-width="0.9" stroke-opacity="0.5" />
    <line x1="26" y1="153" x2="44" y2="153" stroke="#4A3414" stroke-width="1.6" stroke-opacity="0.6" />
    <line x1="60" y1="153" x2="78" y2="153" stroke="#4A3414" stroke-width="1.6" stroke-opacity="0.6" />
    <line x1="94" y1="153" x2="146" y2="153" stroke="#4A3414" stroke-width="1.6" stroke-opacity="0.6" />
    <path d="M 183,154 L 189,158 L 201,148" fill="none" stroke="#3D290E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />

    <!-- Fila 3 (y: 192) -->
    <line x1="18" y1="192" x2="218" y2="192" stroke="#5C421A" stroke-width="0.9" stroke-opacity="0.5" />
    <line x1="26" y1="179" x2="44" y2="179" stroke="#4A3414" stroke-width="1.6" stroke-opacity="0.6" />
    <line x1="60" y1="179" x2="78" y2="179" stroke="#4A3414" stroke-width="1.6" stroke-opacity="0.6" />
    <line x1="94" y1="179" x2="160" y2="179" stroke="#4A3414" stroke-width="1.6" stroke-opacity="0.6" />
    <!-- Rubro pendiente / línea sutil -->
    <line x1="178" y1="179" x2="204" y2="179" stroke="#4A3414" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="2 2" />

    <!-- Fila 4 (y: 218) -->
    <line x1="18" y1="218" x2="218" y2="218" stroke="#5C421A" stroke-width="0.9" stroke-opacity="0.5" />
    <line x1="26" y1="205" x2="44" y2="205" stroke="#4A3414" stroke-width="1.6" stroke-opacity="0.4" />
    <line x1="60" y1="205" x2="78" y2="205" stroke="#4A3414" stroke-width="1.6" stroke-opacity="0.4" />
    <line x1="94" y1="205" x2="138" y2="205" stroke="#4A3414" stroke-width="1.6" stroke-opacity="0.4" />

    <!-- Fila 5 (y: 244) -->
    <line x1="18" y1="244" x2="218" y2="244" stroke="#5C421A" stroke-width="0.9" stroke-opacity="0.5" />

    <!-- Fila 6 (y: 270) -->
    <line x1="18" y1="270" x2="218" y2="270" stroke="#5C421A" stroke-width="0.9" stroke-opacity="0.5" />

    <!-- Fila 7 (y: 296) -->
    <line x1="18" y1="296" x2="218" y2="296" stroke="#5C421A" stroke-width="0.9" stroke-opacity="0.5" />

    <!-- Fila 8 (y: 322) -->
    <line x1="18" y1="322" x2="218" y2="322" stroke="#5C421A" stroke-width="0.9" stroke-opacity="0.5" />

    <!-- Área de Sello / Despacho Final de Tráfico (en esquina inferior derecha de la grilla) -->
    <rect x="172" y="278" width="40" height="38" rx="2" fill="none" stroke="#5C421A" stroke-width="1.5" stroke-dasharray="3 2" stroke-opacity="0.6" />
    <!-- Símbolo geométrico de SELLO de Tráfico -->
    <circle cx="192" cy="297" r="11" fill="none" stroke="#5C421A" stroke-width="1.4" stroke-opacity="0.65" />
    <path d="M 188,297 L 191,300 L 197,294" fill="none" stroke="#5C421A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.65" />
  </g>
</svg>